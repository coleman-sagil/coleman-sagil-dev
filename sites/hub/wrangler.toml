# Worker: coleman-sagil-hub
# Landing/hub page for the coleman-sagil.dev suite: a hero statement plus
# a 3-card grid linking out to each project site (local-llm, IntuiMotion,
# OANDA bot suite).
#
# Intended public hostname (later phase, once the coleman-sagil.dev zone is
# live on Cloudflare and a valid API token/account ID are configured):
#   coleman-sagil.dev (apex — this is the suite's landing page, not a
#   subdomain, so it is the one site in this repo meant to serve the root
#   domain rather than a *.coleman-sagil.dev host)
#
# That hostname is not wired up here. Attaching it requires either a
# Custom Domain (Cloudflare dashboard) or a `routes` entry in this file,
# both of which need a real, active zone for coleman-sagil.dev on the
# target Cloudflare account. Adding a `routes` entry now would pass
# `wrangler deploy --dry-run` (it doesn't resolve zones) but fail on the
# first real deploy against an account with no such zone, so it is left
# out until that phase.

name = "coleman-sagil-hub"
compatibility_date = "2026-08-01"

[assets]
directory = "./public"
not_found_handling = "404-page"
