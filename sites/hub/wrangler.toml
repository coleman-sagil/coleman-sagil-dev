# Worker: coleman-sagil-hub
# Landing/hub page for the coleman-sagil.dev suite: a hero statement plus
# a 3-card grid linking out to each project site (local-llm, IntuiMotion,
# OANDA bot suite).
#
# Public hostname: coleman-sagil.dev (apex) — this is the suite's landing
# page, served at the domain root. The `route` below is a catch-all; the
# other three sites' more specific path-prefix routes
# (coleman-sagil.dev/IntuiMotion/*, /LocalLLM/*, /OANDA/*) win on
# specificity per Cloudflare's route-matching precedence, so this pattern
# only ever actually serves the root and any path not owned by one of
# those three sites. Still reachable at the original *.workers.dev URL
# too — a `route` is an additional trigger, not a replacement for it.

name = "coleman-sagil-hub"
compatibility_date = "2026-08-01"
route = "coleman-sagil.dev/*"

[assets]
directory = "./public"
not_found_handling = "404-page"
