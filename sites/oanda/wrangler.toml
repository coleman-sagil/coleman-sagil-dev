# Worker: coleman-sagil-oanda
# Static portfolio page for the "OANDA trading bot" project.
#
# Public path: coleman-sagil.dev/OANDA (path-based, not a subdomain —
# the suite moved to path routing under the apex domain instead of the
# originally-planned oanda.coleman-sagil.dev subdomain scheme).
# Cloudflare's static-assets router does not strip the route's path
# prefix, so the assets directory below must mirror that path:
# everything lives under public/OANDA/ rather than at public/'s own
# root. Still reachable at the original *.workers.dev URL too — a
# `route` is an additional trigger, not a replacement for it.

name = "coleman-sagil-oanda"
compatibility_date = "2026-08-01"
route = "coleman-sagil.dev/OANDA/*"

[assets]
directory = "./public"
not_found_handling = "404-page"
