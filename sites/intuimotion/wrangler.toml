# Worker: coleman-sagil-intuimotion
# Static portfolio page for the "IntuiMotion" project.
#
# Public path: coleman-sagil.dev/IntuiMotion (path-based, not a
# subdomain — the suite moved to path routing under the apex domain
# instead of the originally-planned intuimotion.coleman-sagil.dev
# subdomain scheme). Cloudflare's static-assets router does not strip
# the route's path prefix, so the assets directory below must mirror
# that path: everything lives under public/IntuiMotion/ rather than at
# public/'s own root. `workers_dev` is explicit below because adding a
# `route` makes Wrangler default it to disabled — without this line the
# original *.workers.dev URL 404s the moment a custom route is attached.

name = "coleman-sagil-intuimotion"
compatibility_date = "2026-08-01"
route = "coleman-sagil.dev/IntuiMotion/*"
workers_dev = true

[assets]
directory = "./public"
not_found_handling = "404-page"
